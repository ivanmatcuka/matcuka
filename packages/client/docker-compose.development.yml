services:
  matcuka-svelte-dev:
    container_name: matcuka-svelte-dev
    image: ivanmatcuka/matcuka-svelte-dev

    build:
      context: .
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL}
        PUBLIC_CMS_URL: ${PUBLIC_CMS_URL}

    env_file:
      - .env

    restart: unless-stopped
    networks:
      - caddy-network

networks:
  caddy-network:
    external: true
