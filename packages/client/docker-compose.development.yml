services:
  matcuka-svelte-dev:
    container_name: matcuka-svelte-dev
    image: ivanmatcuka/matcuka-svelte-dev

    build:
      context: .
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL}
        PUBLIC_CMS_URL: ${PUBLIC_CMS_URL}

    env_file:
      - .env

    restart: unless-stopped
    networks:
      - matcuka-svelte-network-dev

  matcuka-svelte-tunnel-dev:
    image: ivanmatcuka/matcuka_tunnel
    container_name: matcuka-svelte-tunnel-dev

    env_file:
      - .env

    restart: unless-stopped
    networks:
      - matcuka-svelte-network-dev

networks:
  matcuka-svelte-network-dev:
