services:
  matcuka-strapi-dev:
    image: ivanmatcuka/matcuka-strapi-dev
    container_name: matcuka-strapi-dev
    build:
      context: .
      dockerfile: Dockerfile.dev

    environment:
      - NODE_ENV=development

    restart: unless-stopped
    networks:
      - matcuka-strapi-network-dev

  matcuka-db-dev:
    platform: linux/x86_64
    container_name: matcuka-db-dev
    restart: unless-stopped
    image: mariadb

    environment:
      MARIADB_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_DATABASE: ${DATABASE_NAME}
      MARIADB_USER: ${DATABASE_USERNAME}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - matcuka-db-dev:/var/lib/mysql
    networks:
      - matcuka-strapi-network-dev

  matcuka-strapi-tunnel-dev:
    image: ivanmatcuka/matcuka_tunnel
    container_name: matcuka-strapi-tunnel-dev

    env_file:
      - .env

    restart: unless-stopped
    networks:
      - matcuka-strapi-network-dev

networks:
  matcuka-strapi-network-dev:
    driver: bridge

volumes:
  matcuka-db-dev:
