services:
  matcuka-strapi-dev:
    image: ivanmatcuka/matcuka-strapi-dev
    container_name: matcuka-strapi-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    
    environment:
      - NODE_ENV=development
      
    restart: unless-stopped
    networks:
      - matcuka-strapi-network-dev
    volumes:
      - matcuka-db-dev:/opt/app/.tmp

  matcuka-strapi-tunnel-dev:
    image: ivanmatcuka/matcuka_tunnel
    container_name: matcuka-strapi-tunnel-dev

    env_file:
      - .env
      
    restart: unless-stopped
    networks:
      - matcuka-strapi-network-dev

networks:
  matcuka-strapi-network-dev:
    driver: bridge

volumes:
  matcuka-db-dev: