services:
  matcuka-strapi:
    image: ivanmatcuka/matcuka-strapi
    container_name: matcuka-strapi
    build:
      context: .
      dockerfile: Dockerfile
    
    environment:
      - NODE_ENV=development
      
    restart: unless-stopped
    networks:
      - matcuka-strapi-network
    volumes:
      - matcuka-strapi-db:/opt/app/.tmp/data.db

  matcuka-strapi-tunnel:
    image: ivanmatcuka/matcuka_tunnel
    container_name: matcuka-strapi-tunnel

    env_file:
      - .env
      
    restart: unless-stopped
    networks:
      - matcuka-strapi-network

networks:
  matcuka-strapi-network:
    driver: bridge

volumes:
  matcuka-strapi-db: