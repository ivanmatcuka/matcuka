networks:
  proxy-network:
    external: true

services:
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: matcuka_strapi
    container_name: matcuka_strapi
    ports:
      - 1338:1337
    environment:
      - NODE_ENV=production
    volumes:
      - ./config:/opt/app/config
      - ./src:/opt/app/src
      - ./package.json:/opt/package.json
      - ./yarn.lock:/opt/yarn.lock
      - ./.env:/opt/app/.env
      - ./public/uploads:/opt/app/public/uploads
      - ./.tmp/data.db:/opt/app/.tmp/data.db
    restart: unless-stopped
    networks:
      - proxy-network
