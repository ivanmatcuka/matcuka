services:
  matcuka-strapi:
    image: ivanmatcuka/matcuka-strapi
    container_name: matcuka-strapi
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      - NODE_ENV=production

    restart: unless-stopped
    networks:
      - matcuka-strapi-network

  matcuka-db:
    platform: linux/x86_64
    container_name: matcuka-db
    restart: unless-stopped
    image: mariadb

    environment:
      MARIADB_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_DATABASE: ${DATABASE_NAME}
      MARIADB_USER: ${DATABASE_USERNAME}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - matcuka-db:/var/lib/mysql
    networks:
      - matcuka-strapi-network

  matcuka-strapi-tunnel:
    image: ivanmatcuka/matcuka_tunnel
    container_name: matcuka-strapi-tunnel

    env_file:
      - .env

    restart: unless-stopped
    networks:
      - matcuka-strapi-network

networks:
  matcuka-strapi-network:
    driver: bridge

volumes:
  matcuka-db:
